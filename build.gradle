plugins {
    id 'fabric-loom' version '1.7.4'
}

// ===========================================================================
// 多版本档案表：一个 -Pmc_version=1.20.x 切换整套依赖（yarn / api / cloth 一起换）
// ===========================================================================
def MC_PROFILES = [
        '1.20.1': [
                yarn : '1.20.1+build.10',
                loader: '0.16.14',
                api  : '0.92.12+1.20.1',
                cloth: '11.1.106',
                modmenu: '7.2.2',
                dep  : '~1.20.1',
        ],
        '1.20.4': [
                yarn : '1.20.4+build.3',
                loader: '0.16.14',
                api  : '0.97.2+1.20.4',
                cloth: '13.0.121',
                modmenu: '9.2.0',
                // 1.20.2~1.20.4 同代 API，共用一个 jar
                dep  : '>=1.20.2 <1.21',
        ],
]

def mcVersion = (project.findProperty('mc_version') ?: '1.20.4').toString()
def profile = MC_PROFILES[mcVersion]
if (profile == null) {
    throw new GradleException("未知的 mc_version=${mcVersion}，可选值：${MC_PROFILES.keySet().join(' / ')}")
}

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        // Cloth Config 的发布仓库
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        // Mod Menu（只用于在模组列表里显示「配置」按钮）
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        // Mod Menu 的传递依赖 placeholder-api 托管在这里（Patbox / Nucleoid）
        name = 'Nucleoid'
        url = 'https://maven.nucleoid.xyz/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${profile.yarn}:v2"

    modImplementation "net.fabricmc:fabric-loader:${profile.loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${profile.api}"

    // Cloth Config 只用于设置页：modApi = 编译期可见，运行期由玩家自己安装
    modApi "me.shedaniel.cloth:cloth-config-fabric:${profile.cloth}"

    // Mod Menu 只提供「配置」按钮的接入点：modCompileOnly = 编译期需要，运行期没有也不影响。
    // transitive = false：Mod Menu 的 POM 里带了个 placeholder-api（托管在 Patbox 的
    // Nucleoid 仓库），我们只用它的 api 接口、不用那些传递依赖，关掉省得再去配仓库。
    modCompileOnly("com.terraformersmc:modmenu:${profile.modmenu}") {
        transitive = false
    }
}

// 把版本号与目标 MC 范围填进 fabric.mod.json 的占位符
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dep', profile.dep

    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_dep': profile.dep
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.register('printProfile') {
    group = 'help'
    description = '显示本次构建使用的 Minecraft / Yarn / Fabric API / Cloth Config 版本'
    doLast {
        println "mc_version   = ${mcVersion}"
        println "yarn         = ${profile.yarn}"
        println "fabric-api   = ${profile.api}"
        println "cloth-config = ${profile.cloth}"
        println "minecraft dep= ${profile.dep}"
        println "jar version  = ${project.version}"
    }
}
