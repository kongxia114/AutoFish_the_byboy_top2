name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的新提交会取消还在跑的旧构建，避免网页上传时堆积重复任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MC ${{ matrix.mc }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20.1', '1.20.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 仓库里不放 gradle-wrapper.jar（二进制不便入库），直接用官方分发包
      - name: Set up Gradle 8.8
        run: |
          curl -sSLo "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.8/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.mc }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.mc }}-
            gradle-${{ runner.os }}-

      - name: Show target versions
        run: gradle printProfile -Pmc_version=${{ matrix.mc }} --no-daemon --console=plain -q

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle build -Pmc_version=${{ matrix.mc }} --no-daemon --console=plain --stacktrace 2>&1 | tee gradle-build.log

      # 失败时把真正的错误行暴露成 annotation（公开可读，便于在仓库外定位问题）
      - name: Surface errors
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then
            echo "没有生成 gradle-build.log"
            exit 0
          fi
          echo "===== 错误摘要 ====="
          grep -nE "error:|Execution failed for task|Caused by:|> Task .*FAILED|Could not |FAILURE:" gradle-build.log | head -n 40 || true
          echo "===== What went wrong 上下文 ====="
          awk '/What went wrong/{flag=1} flag{print; n++} n>80{exit}' gradle-build.log || true
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            if [ "$n" -gt 10 ]; then break; fi
            clean=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
            echo "::error title=Gradle::${clean}"
          done < <(grep -E "error:|Execution failed for task|Caused by:" gradle-build.log | head -n 10)

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidin-autofish-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.mc }}
          path: gradle-build.log
          if-no-files-found: warn
